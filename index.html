<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Calisthenics Forum</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <section class="auth-card">
      <h1>Calisthenics Forum</h1>
      <p>Ingresa para interactuar con la comunidad</p>
      
      <form action="dashboard.html" method="get">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="usuario@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </form>
    </section>
  </div>
  <footer>
    <p>&copy; 2026 Calisthenics Forum. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
