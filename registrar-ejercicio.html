<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ejercicio - Calistenia Tarija</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header-nav">
    <a href="dashboard.html" class="logo">Calistenia Tarija</a>
    <nav>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="ejercicios.html">Ejercicios</a></li>
        <li><a href="rutinas.html">Rutinas</a></li>
        <li><a href="index.html" class="btn-logout">Cerrar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <header class="page-header">
      <div>
        <h1>Registrar Nuevo Ejercicio</h1>
        <p class="page-subtitle">Ingresa la información técnica para incorporar el ejercicio a la base comunitaria.</p>
      </div>
      <a href="ejercicios.html" class="link-back">Volver a Ejercicios</a>
    </header>

    <section class="form-container">
      <form action="ejercicios.html" method="get">
        <div class="form-group">
          <label for="nombre">Nombre del Ejercicio</label>
          <input type="text" id="nombre" class="form-control" placeholder="Ej. Front Lever" required>
        </div>

        <div class="form-group">
          <label for="grupo">Grupo Muscular Principal</label>
          <select id="grupo" class="form-control" required>
            <option value="">Seleccione grupo muscular</option>
            <option value="espalda">Espalda / Tracción</option>
            <option value="pecho">Pectoral / Empuje</option>
            <option value="hombros">Hombros</option>
            <option value="brazos">Brazos (Bíceps / Tríceps)</option>
            <option value="piernas">Piernas</option>
            <option value="core">Core / Abdomen</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dificultad">Nivel de Dificultad</label>
          <select id="dificultad" class="form-control" required>
            <option value="principiante">Principiante</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
            <option value="elite">Élite</option>
          </select>
        </div>

        <div class="form-group">
          <label for="descripcion">Instrucciones de Ejecución</label>
          <textarea id="descripcion" class="form-control" placeholder="Describe la técnica correcta, respiración y advertencias posturales..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Ejercicio</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Calistenia Tarija.</p>
  </footer>
</body>
</html>
